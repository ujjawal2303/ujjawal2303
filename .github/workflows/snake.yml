name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate animated snake SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          npx --yes generate-snake-animation@3 --github_user "${GITHUB_REPOSITORY_OWNER}" --github_token "${GITHUB_TOKEN}" --output "dist/github-contribution-grid-snake.svg"
          npx --yes generate-snake-animation@3 --github_user "${GITHUB_REPOSITORY_OWNER}" --github_token "${GITHUB_TOKEN}" --output "dist/github-contribution-grid-snake-dark.svg?palette=github-dark"

      - name: Publish SVGs to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Update contribution snake"
