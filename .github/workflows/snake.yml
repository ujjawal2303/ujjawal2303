name: Generate profile visuals

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          npx --yes generate-snake-animation@3 --github_user "${GITHUB_REPOSITORY_OWNER}" --github_token "${GITHUB_TOKEN}" --output "dist/github-contribution-grid-snake.svg"
          npx --yes generate-snake-animation@3 --github_user "${GITHUB_REPOSITORY_OWNER}" --github_token "${GITHUB_TOKEN}" --output "dist/github-contribution-grid-snake-dark.svg?palette=github-dark"

      - name: Generate contribution graph and profile highlights
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const user = process.env.GITHUB_USER;
          const token = process.env.GITHUB_TOKEN;
          const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

          async function main() {
            const query = `query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount color } }
                  }
                }
              }
            }`;
            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables: { login: user } })
            });
            const payload = await response.json();
            if (!response.ok || payload.errors || !payload.data?.user) {
              throw new Error('GitHub contribution query failed: ' + JSON.stringify(payload.errors || payload));
            }
            const calendar = payload.data.user.contributionsCollection.contributionCalendar;
            const weeks = calendar.weeks;
            const cell = 11, gap = 3, left = 38, top = 32;
            const width = left + weeks.length * (cell + gap) + 8;
            const height = top + 7 * (cell + gap) + 30;
            const colors = ['#161b22', '#0e4429', '#006d32', '#26a641', '#39d353'];
            const rects = [];
            weeks.forEach((week, x) => week.contributionDays.forEach(day => {
              const level = day.contributionCount === 0 ? 0 : day.contributionCount < 3 ? 1 : day.contributionCount < 6 ? 2 : day.contributionCount < 10 ? 3 : 4;
              const date = new Date(day.date + 'T00:00:00Z');
              rects.push(`<rect x="${left + x*(cell+gap)}" y="${top + date.getUTCDay()*(cell+gap)}" width="${cell}" height="${cell}" rx="2" fill="${colors[level]}"><title>${esc(day.date)}: ${day.contributionCount} contributions</title></rect>`);
            }));
            const months = [];
            let lastMonth = '';
            weeks.forEach((week, x) => {
              const d = week.contributionDays[0]?.date;
              if (!d) return;
              const month = d.slice(0, 7);
              if (month !== lastMonth) { months.push(`<text x="${left + x*(cell+gap)}" y="17" fill="#9da7b3" font-size="11">${new Date(d+'T00:00:00Z').toLocaleString('en-US',{month:'short',timeZone:'UTC'})}</text>`); lastMonth = month; }
            });
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i) => i%2===1 ? `<text x="2" y="${top+i*(cell+gap)+9}" fill="#9da7b3" font-size="10">${d}</text>` : '').join('');
            const graph = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 ${width} ${height}" role="img" aria-label="GitHub contribution calendar for ${esc(user)}"><rect width="100%" height="100%" rx="8" fill="#0d1117"/>${months.join('')}${days}${rects.join('')}<text x="${left}" y="${height-7}" fill="#9da7b3" font-size="11">${calendar.totalContributions} contributions in the last year</text></svg>`;
            fs.writeFileSync('dist/contribution-graph.svg', graph);

            const restHeaders = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const [profileRes, reposRes] = await Promise.all([
              fetch(`https://api.github.com/users/${user}`, { headers: restHeaders }),
              fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=updated`, { headers: restHeaders })
            ]);
            if (!profileRes.ok || !reposRes.ok) throw new Error('GitHub REST API request failed');
            const profile = await profileRes.json();
            const repos = await reposRes.json();
            const stars = repos.reduce((sum, repo) => sum + repo.stargazers_count, 0);
            const forks = repos.reduce((sum, repo) => sum + repo.forks_count, 0);
            const metrics = [
              ['PUBLIC REPOSITORIES', profile.public_repos],
              ['FOLLOWERS', profile.followers],
              ['STARS EARNED', stars],
              ['FORKS', forks]
            ];
            const cards = metrics.map((m,i) => {
              const x = 18 + (i%2)*310, y = 18 + Math.floor(i/2)*88;
              return `<rect x="${x}" y="${y}" width="292" height="70" rx="9" fill="#161b22" stroke="#30363d"/><text x="${x+16}" y="${y+25}" fill="#9da7b3" font-size="11" letter-spacing="1">${m[0]}</text><text x="${x+16}" y="${y+54}" fill="#79d7ff" font-size="24" font-weight="700">${m[1]}</text>`;
            }).join('');
            const highlights = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 638 196" role="img" aria-label="GitHub profile highlights for ${esc(user)}"><rect width="638" height="196" rx="12" fill="#0d1117"/>${cards}</svg>`;
            fs.writeFileSync('dist/profile-highlights.svg', highlights);
          }
          main().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Publish profile visuals to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Update profile visuals"
